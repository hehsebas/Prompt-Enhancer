name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Cambia esto si tu rama principal tiene otro nombre (ej: master)
    paths:
      - 'frontend/**'  # Solo se ejecuta si hay cambios en frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci
      
      - name: Build del proyecto
        working-directory: ./frontend
        run: npm run build
      
      - name: Copiar icon.svg a dist
        run: cp icon.svg frontend/dist/icon.svg
      
      - name: Crear .htaccess
        run: |
          cat > frontend/dist/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-l
            RewriteRule . /index.html [L]
          </IfModule>
          EOF
      
      - name: Desplegar a Hostinger vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
